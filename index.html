<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Läskompis">
<meta name="theme-color" content="#E9EEF2">
<title>Läskompis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EEF2;
  --ink:#16212B;
  --faded:#93A4B2;
  --mark:#FFCF5C;
  --good:#2E9E7B;
  --soft:#E5A97F;
  --rule:#C8D4DC;
  --panel:#16212B;
  --panel-ink:#93AABB;
  --panel-hi:#E9EEF2;

  --read-size:52px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* dynamic viewport unit tracks mobile browsers' collapsing address bar */
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif;
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ---------- top bar ---------- */
.top{
  display:flex;align-items:center;gap:20px;
  padding:14px 24px;
  border-bottom:1px solid var(--rule);
  flex:0 0 auto;
}
.wordmark{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faded);
}
.top-spacer{flex:1}
.score{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;color:var(--faded);
  display:flex;align-items:center;gap:8px;
}
.score svg{width:20px;height:20px;color:var(--mark)}
.score b{font-size:24px;color:var(--good);font-weight:500;font-variant-numeric:tabular-nums}
.tbtn{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  letter-spacing:.06em;
  background:none;border:1px solid var(--rule);border-radius:2px;
  color:var(--faded);padding:7px 12px;cursor:pointer;
}
.tbtn:hover{border-color:var(--ink);color:var(--ink)}
.tbtn:focus-visible{outline:2px solid var(--good);outline-offset:2px}

/* ---------- reading stage ---------- */
.main{
  flex:1 1 auto;
  display:flex;
  min-height:0;
}
.side{
  flex:0 0 auto;
  width:190px;
  border-right:1px solid var(--rule);
  padding:18px 14px;
  overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;
}
.side .slabel{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faded);margin-bottom:4px;
}
.sbtn{
  font-family:'Atkinson Hyperlegible',sans-serif;
  font-size:14px;text-align:left;
  background:none;border:1px solid transparent;border-radius:4px;
  color:var(--ink);padding:8px 10px;cursor:pointer;
}
.sbtn:hover{border-color:var(--rule);background:#fff}
.sbtn.active{background:var(--mark);font-weight:700}
.sbtn:focus-visible{outline:2px solid var(--good);outline-offset:2px}
/* On narrow screens the text list becomes a horizontal chip strip above the
   reading area, and the adult-facing diagnostics give way to reading space. */
@media (max-width:760px){
  .top{gap:10px;padding:10px 12px}
  .tbtn{padding:6px 8px;font-size:11px;letter-spacing:.02em}
  .score b{font-size:19px}
  .main{flex-direction:column}
  .side{
    width:auto;
    flex-direction:row;gap:8px;
    overflow-x:auto;overflow-y:hidden;
    border-right:0;border-bottom:1px solid var(--rule);
    padding:10px 12px;
    -webkit-overflow-scrolling:touch;
  }
  .slabel{display:none}
  .sbtn{
    flex:0 0 auto;white-space:nowrap;
    border:1px solid var(--rule);border-radius:18px;
    background:#fff;
    font-size:13px;padding:6px 12px;
  }
  .stage{padding:16px 5vw}
  #sentence{line-height:1.7}
  .hint{font-size:16px;min-height:26px;padding-bottom:6px}
  .icon{width:62px;height:62px}
  .icon svg{width:27px;height:27px}
  .controls{gap:10px;padding:0 12px 12px}
  .key{display:none}          /* keyboard hints are meaningless on touch */
  .readouts{display:none}     /* diagnostics hidden — progress track stays */
  .panel{padding:8px 12px 10px}
  .track{height:14px}
  .seg.current{height:14px}
}
@media (max-width:480px){
  .wordmark{display:none}
}
.stage{
  flex:1 1 auto;
  display:flex;
  padding:40px 6vw;
  overflow-y:auto;
}
/* margin:auto instead of flex centering: a sentence taller than the stage
   then scrolls normally instead of having its top clipped out of reach */
#sentence{
  margin:auto;
  /* cap by viewport width so long words fit on narrow screens */
  font-size:min(var(--read-size), 11vw);
  line-height:1.85;
  max-width:20ch;
  text-align:left;
  font-weight:400;
  letter-spacing:.01em;
}
.w{
  display:inline-block;
  padding:2px 6px;
  margin:0 1px;
  border-radius:4px;
  transition:color .12s linear, background-color .12s linear, opacity .12s linear;
}
@media (prefers-reduced-motion:reduce){ .w{transition:none} }

.w.coming{color:var(--ink)}
.w.done{color:var(--faded)}
.w.skipped{color:var(--faded);text-decoration:underline;text-decoration-color:var(--soft);text-decoration-thickness:2px;text-underline-offset:6px}
.w.current{background:var(--mark);color:var(--ink);font-weight:700}
.w.helping{background:var(--soft);color:var(--ink);font-weight:700}

/* ---------- child-facing hint ---------- */
.hint{
  flex:0 0 auto;
  text-align:center;
  font-size:20px;
  color:var(--faded);
  min-height:34px;
  padding-bottom:10px;
}
.hint.warm{color:var(--good)}

/* ---------- controls ---------- */
.controls{
  flex:0 0 auto;
  display:flex;justify-content:center;gap:12px;
  padding:0 24px 20px;
}
.ctl{display:flex;flex-direction:column;align-items:center;gap:7px}
.key{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--faded);letter-spacing:.04em;
}
.icon{
  width:82px;height:82px;border-radius:50%;
  border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);
  display:grid;place-items:center;
  cursor:pointer;padding:0;
}
.icon svg{width:36px;height:36px;display:block}
.icon.primary{background:var(--ink);color:var(--paper)}
.icon.live{background:var(--good);border-color:var(--good);color:#fff}
.icon:focus-visible{outline:3px solid var(--good);outline-offset:4px}
.icon:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){ .icon:active{transform:none} }

.big{
  font-family:'Atkinson Hyperlegible',sans-serif;
  font-size:19px;
  padding:14px 30px;
  border-radius:6px;
  border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);
  cursor:pointer;
}
.big.primary{background:var(--ink);color:var(--paper)}
.big:focus-visible{outline:3px solid var(--good);outline-offset:3px}
.big:disabled{opacity:.35;cursor:not-allowed}

/* ---------- instrument panel ---------- */
.panel{
  flex:0 0 auto;
  background:var(--panel);
  color:var(--panel-ink);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:12px 24px 14px;
  display:flex;flex-direction:column;gap:10px;
}
.track{
  display:flex;gap:3px;height:26px;align-items:flex-end;
}
.seg{
  flex:1 1 0;height:6px;border-radius:1px;
  background:#2C3D4C;
  transition:height .1s linear, background-color .1s linear;
}
.seg.done{background:var(--good)}
.seg.skipped{background:var(--soft)}
.seg.current{background:var(--mark);height:26px}
.readouts{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.ro{display:flex;gap:7px;align-items:baseline}
.ro span{color:#5C7182;letter-spacing:.08em}
.ro b{color:var(--panel-hi);font-weight:500;font-variant-numeric:tabular-nums}
.level{
  width:90px;height:6px;background:#2C3D4C;border-radius:3px;overflow:hidden;
}
.level i{display:block;height:100%;width:0%;background:var(--good)}
.hyp{color:#5C7182;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}

/* ---------- setup sheet ---------- */
.sheet{
  position:fixed;inset:0;background:rgba(22,33,43,.55);
  display:none;align-items:center;justify-content:center;padding:24px;
  z-index:10;
}
.sheet.open{display:flex}
.card{
  background:var(--paper);border-radius:8px;
  width:min(620px,100%);max-height:82vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.card h2{font-size:21px;margin-bottom:3px}
.card p.sub{color:var(--faded);font-size:14.5px;line-height:1.5}
.card > header{padding:24px 26px 0;flex:0 0 auto}

.tabs{
  display:flex;gap:2px;padding:16px 26px 0;
  border-bottom:1px solid var(--rule);flex:0 0 auto;
}
.tab{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;border-bottom:2px solid transparent;
  color:var(--faded);padding:10px 13px;cursor:pointer;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--good);outline-offset:-2px}

.cardbody{padding:22px 26px;overflow-y:auto;flex:1 1 auto;min-height:0}
.tabpage{display:none}
.tabpage.active{display:block}
.tabpage .field:last-child{margin-bottom:0}

.card > footer{
  padding:14px 26px 18px;border-top:1px solid var(--rule);
  flex:0 0 auto;display:flex;justify-content:flex-end;
}
.field{margin-bottom:20px}
.field label{
  display:block;font-family:'JetBrains Mono',monospace;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faded);margin-bottom:7px;
}
textarea,select,input[type=range]{width:100%;font-family:inherit}
textarea{
  font-size:17px;line-height:1.6;padding:12px;border:1px solid var(--rule);
  border-radius:4px;background:#fff;color:var(--ink);resize:vertical;min-height:110px;
}
select{font-size:15px;padding:9px;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink)}
.voicerow{display:flex;gap:8px;align-items:stretch}
.voicerow select{flex:1;min-width:0}
.voicerow .tbtn{flex:0 0 auto;white-space:nowrap}
.vinfo{font-size:12.5px;color:var(--faded);line-height:1.45;margin-top:7px}
.check{
  display:flex;gap:10px;align-items:flex-start;
  font-family:'Atkinson Hyperlegible',sans-serif;font-size:15px;
  text-transform:none;letter-spacing:0;color:var(--ink);
  margin-bottom:11px;cursor:pointer;
}
.check input{margin-top:3px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--ink)}
.check em{display:block;font-style:normal;font-size:12.5px;color:var(--faded);margin-top:2px}
.row{display:flex;gap:18px}
.row>.field{flex:1}
.val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);float:right}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  font-size:14px;padding:7px 13px;border:1px solid var(--rule);border-radius:20px;
  background:#fff;cursor:pointer;color:var(--ink);
}
.chip em{
  font-family:'JetBrains Mono',monospace;font-style:normal;
  font-size:11px;color:var(--faded);margin-left:5px;
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--good);outline-offset:2px}
.note{
  font-size:14px;color:var(--faded);line-height:1.6;
  border-left:2px solid var(--rule);padding-left:14px;
}
.note + .note{margin-top:16px}
.err{
  background:var(--soft);color:var(--ink);padding:12px 14px;border-radius:4px;
  font-size:15px;line-height:1.5;margin-bottom:18px;display:none;
}
.err.show{display:block}
</style>
</head>
<body>

<div class="top">
  <div class="wordmark">läskompis</div>
  <div class="top-spacer"></div>
  <div class="score" id="scoreBox"><b id="score">0</b></div>
  <button class="tbtn" id="resetBtn" aria-label="Starta om lyssningen" title="Om markören har fastnat: starta om taligenkänningen. Position och poäng behålls.">Starta om lyssningen</button>
  <button class="tbtn" id="setupBtn" aria-label="Text och inställningar" title="Text och inställningar">Text &amp; inställningar</button>
</div>

<div class="main">
  <nav class="side" id="side" aria-label="Färdiga texter"></nav>
  <div class="stage"><div id="sentence"></div></div>
</div>

<div class="hint" id="hint">Tryck på Börja läsa när du är redo.</div>

<div class="controls">
  <div class="ctl">
    <button class="icon primary" id="startBtn" aria-label="Börja läsa" title="Börja läsa — mellanslag"></button>
    <div class="key">[mellanslag]</div>
  </div>
  <div class="ctl">
    <button class="icon" id="sayBtn" aria-label="Lyssna på ordet" title="Läs ordet åt mig — L"></button>
    <div class="key">[L]</div>
  </div>
  <div class="ctl">
    <button class="icon" id="nextBtn" aria-label="Nästa mening" title="Nästa mening — högerpil"></button>
    <div class="key">[&rarr;]</div>
  </div>
</div>

<div class="panel">
  <div class="track" id="track"></div>
  <div class="readouts">
    <div class="ro"><span>LATENS</span><b id="roLat">–</b></div>
    <div class="ro"><span>MEDIAN</span><b id="roMed">–</b></div>
    <div class="ro"><span>ORD</span><b id="roPos">0/0</b></div>
    <div class="ro"><span>MISS</span><b id="roMiss">0</b></div>
    <div class="ro"><span>TOK</span><b id="roTok">0/0</b></div>
    <div class="ro"><span>SVÅRA</span><b id="roHard">0</b></div>
    <div class="ro"><span>HÖRDE</span><b id="roHeard">—</b></div>
    <div class="ro"><span>NIVÅ</span><div class="level"><i id="lvl"></i></div></div>
    <div class="hyp" id="roHyp">—</div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="card" role="dialog" aria-label="Text och inställningar">

    <header>
      <h2>Text &amp; inställningar</h2>
      <p class="sub" id="sheetSub">Klistra in läsläxan, en mening per rad.</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="text"     aria-selected="true">Text</button>
      <button class="tab" role="tab" data-tab="reading"  aria-selected="false">Läsning</button>
      <button class="tab" role="tab" data-tab="voice"    aria-selected="false">Röst</button>
    </div>

    <div class="cardbody">
      <div class="err" id="err"></div>

      <section class="tabpage active" data-page="text">
        <div class="field">
          <label>Färdiga texter</label>
          <div class="presets" id="presets"></div>
        </div>
        <div class="field">
          <label>Egen text</label>
          <textarea id="txt"></textarea>
        </div>
      </section>

      <section class="tabpage" data-page="reading">
        <div class="field">
          <label>Textstorlek <span class="val" id="vSize">52 px</span></label>
          <input type="range" id="rSize" min="28" max="86" step="2" value="52">
        </div>
        <div class="field">
          <label>Väntetid före hjälp <span class="val" id="vHold">8,0 s</span></label>
          <input type="range" id="rHold" min="1000" max="20000" step="500" value="8000">
        </div>
        <div class="field">
          <label>Stränghet</label>
          <select id="strict">
            <option value="mild">Mild — släpper igenom nästan allt</option>
            <option value="normal" selected>Normal — kräver rätt begynnelsebokstav</option>
            <option value="strict">Sträng — inga överhopp, nästan exakt match</option>
          </select>
        </div>
      </section>

      <section class="tabpage" data-page="voice">
        <div class="field">
          <label>Talhastighet — ord <span class="val" id="vRate">0,90</span></label>
          <input type="range" id="rRate" min="0.6" max="1.6" step="0.05" value="0.9">
        </div>
        <div class="field">
          <label>Röst</label>
          <div class="voicerow">
            <select id="voice"></select>
            <button class="tbtn" id="testVoiceBtn" title="Hör hur rösten låter">Prova</button>
          </div>
          <p class="vinfo" id="voiceInfo"></p>
        </div>
        <div class="field">
          <label>Ljud</label>
          <label class="check">
            <input type="checkbox" id="cbOk">
            <span>Pling när ett ord blir rätt <em>avstängt som standard</em></span>
          </label>
          <label class="check">
            <input type="checkbox" id="cbFail">
            <span>Ton när ett ord blir fel <em>avstängt som standard — igenkännaren hör fel ibland</em></span>
          </label>
        </div>
        <div class="field">
          <label>Ljudvolym <span class="val" id="vVol">85 %</span></label>
          <input type="range" id="rVol" min="0" max="100" step="5" value="85">
        </div>
      </section>

    </div>

    <footer>
      <button class="big primary" id="closeBtn">Klart</button>
    </footer>

  </div>
</div>

<script>
'use strict';

/* ================= texts ================= */
const PRESETS = {

  'Första orden': [

    'Vi går hem nu.',
    'Han har en boll.',
    'Hon är glad i dag.',
    'Det är kallt ute.',

  'Korta meningar': [

  'Meningar': [

  'Djur och natur': [

    'Stjärnan lyste starkast längst upp i norr.',

  'Berättelse: Nyckeln': [
    'Elsa hittade en liten nyckel i lådan under trappan.',
    'Nyckeln var av mässing och kändes kall i handen.',

    'Ingen dörr ville öppna sig.',

/* ================= state ================= */
const S = {
  lines: PRESETS['Meningar'].slice(),
  source: null,     // the text as loaded — hard-word review replaces `lines`, this restores them
  line: 0,
  words: [],        // {raw, norm, state}
  pos: 0,
  score: 0,
  misses: 0,
  running: false,
  holdoff: 8000,
  strict: 'normal',
  hard: new Map(),
  reviewing: false,
  ignoreResults: false,
  recLive: false,
  posSince: 0,
  hypConsumed: 0,
  lastRescue: 0,
  sndOk: false,
  sndFail: false,
  vol: 0.85,
  lastMiscueKey: '',
  lastMiscueAt: 0,
  speakTimer: null,
  speakSeq: 0,
  rate: 0.9,
  voice: null,
  lats: [],
  onsetAt: null,    // timestamp of voice onset
  holdTimer: null,
  finishTimer: null,
  starting: false,
  speaking: false
};

/* ================= audio ================= */
/* Generated with WebAudio, no files. Short and understated: the sound should
   confirm, not judge. The failure sound is therefore a soft descending tone
   and off by default — the recognizer mishears sometimes, and a negative
   signal is then unfair to a child who actually read correctly. */
let sfxCtx = null, sfxOut = null;

function sfx(){
  if(!S.vol) return null;
  if(!sfxCtx){
    try{ sfxCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ return null; }
    // Compressor last in the chain: the tones sum and would otherwise clip
    // when the volume is turned up.
    const comp = sfxCtx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.12;
    sfxOut = sfxCtx.createGain();
    sfxOut.gain.value = 1;
    sfxOut.connect(comp);
    comp.connect(sfxCtx.destination);
  }
  if(sfxCtx.state==='suspended') sfxCtx.resume().catch(()=>{});
  return sfxCtx;
}

/* Short attack, short plateau, soft decay. The plateau makes the sound feel
   as loud as speech — a pure blip sounds weaker than it measures. */
function tone(freq, startAt, dur, peak, type='sine'){
  const ctx = sfx(); if(!ctx) return;
  const t = ctx.currentTime + startAt;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  const v = Math.max(0.0001, peak * S.vol);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.010);
  g.gain.setValueAtTime(v, t + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(sfxOut);
  osc.start(t); osc.stop(t + dur + 0.03);
}

/* The same happy chime every time — recognizable and reliable: hearing it
   should feel like a small celebration of reading a word correctly. */
function playOk(){
  if(!S.sndOk) return;
  tone(1046.5, 0, 0.22, 0.55);
  tone(1568, 0.05, 0.18, 0.30);
}

function playFail(){
  if(!S.sndFail) return;
  tone(330, 0, 0.22, 0.38, 'triangle');
  tone(262, 0.09, 0.26, 0.32, 'triangle');
}

function playDone(){
  if(!S.sndOk) return;
  [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, i*0.11, 0.40, 0.45));
}

const $ = id => document.getElementById(id);

/* ================= normalization ================= */
function norm(w){
  return w.toLowerCase()
    .replace(/[.,!?;:"'“”„»«…\-–—()]/g,'')
    .trim();
}
function tokens(str){
  return str.split(/\s+/).map(norm).filter(Boolean);
}

/* similarity: normalized Levenshtein */
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function sim(a,b){
  if(!a||!b) return 0;
  const d=lev(a,b), L=Math.max(a.length,b.length);
  return 1 - d/L;
}

/* Strictness levels.
   budget = allowed number of character errors, depending on word length
   first  = requires the first letter to match
   skip   = how many words may be skipped forward
   dwell  = how long the cursor must have rested on a word before it may be
            skipped. Without this you could start reading mid-sentence. */
const STRICTNESS = {
  mild:   { budget:l=> l<=3?1 : l<=6?2 : 3, first:false, skip:2, dwell:700 },
  normal: { budget:l=> l<=3?0 : l<=6?1 : 2, first:true,  skip:1, dwell:1800 },
  strict: { budget:l=> l<=4?0 : 1,          first:true,  skip:0, dwell:0 }
};

/* Replaces the old tolerance threshold. Returns true/false, not a float —
   for short words there is no meaningful gray zone. */
function matches(hyp, ref){
  if(!hyp || !ref) return false;
  if(hyp === ref) return true;
  const rule = STRICTNESS[S.strict];
  if(rule.first && ref.length >= 4 && hyp[0] !== ref[0]) return false;
  // large length difference = different word, not a pronunciation variant
  if(Math.abs(hyp.length - ref.length) > rule.budget(ref.length)) return false;
  return lev(hyp, ref) <= rule.budget(ref.length);
}

/* ================= sentence ================= */
/* The recognizer accumulates results across the whole session. On a sentence
   change that list must be cleared, or old speech gets matched against the new
   sentence — common short words like "och" or "på" then move the cursor without
   anyone having said anything. The only reliable way to clear it is to restart
   the session. */
function resetTranscript(){
  S.onsetAt = null;
  S.hypConsumed = 0;
  wasLoud = false;
  $('roHyp').textContent = '—';
  $('roHeard').textContent = '—';
  if(!S.running || !rec) return;
  /* Only stop() a session that is actually live: stopping an already-stopped
     recognizer fires no onend, so nothing would restart it and the latch below
     would never be released — leaving the app deaf while it looks live. */
  if(!S.recLive){ resetRecognition(); return; }
  S.ignoreResults = true;            // drop anything arriving before the restart
  try{ rec.stop(); }catch(e){}       // onend restarts, onstart releases the latch
}

function loadLine(){
  const raw = (S.lines[S.line]||'').trim();
  S.words = raw.split(/\s+/).filter(Boolean).map(w=>({
    raw:w, norm:norm(w), state:'coming'
  }));
  S.pos = 0;
  S.posSince = performance.now();
  S.lastMiscueKey = '';
  resetTranscript();
  renderSentence();
  renderTrack();
  updateReadouts();
}

function renderSentence(){
  const el = $('sentence');
  el.innerHTML = '';
  S.words.forEach((w,i)=>{
    const s = document.createElement('span');
    s.className = 'w ' + (i===S.pos && S.running ? 'current' : w.state);
    s.textContent = w.raw;
    s.dataset.i = i;
    s.addEventListener('click',()=>{ speak(w.raw); });
    el.appendChild(s);
    el.appendChild(document.createTextNode(' '));
  });
  // on small screens the sentence can be taller than the stage —
  // keep the word being read in view as the cursor advances
  const cur = el.querySelector('.w.current');
  if(cur) cur.scrollIntoView({
    block:'center',
    behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'
  });
}

function renderTrack(){
  const t = $('track');
  t.innerHTML='';
  S.words.forEach((w,i)=>{
    const d=document.createElement('div');
    d.className='seg ' + (i===S.pos && S.running ? 'current' : (w.state==='coming'?'':w.state));
    t.appendChild(d);
  });
}

function updateReadouts(){
  $('roPos').textContent = `${S.pos}/${S.words.length}`;
  $('roMiss').textContent = S.misses;
  $('score').textContent = S.score;
  if(S.lats.length){
    const sorted=[...S.lats].sort((a,b)=>a-b);
    $('roMed').textContent = Math.round(sorted[Math.floor(sorted.length/2)])+' ms';
  }
}

function setHint(txt, warm){
  const h=$('hint');
  h.textContent = txt;
  h.className = 'hint' + (warm?' warm':'');
}

/* ================= alignment (greedy token passing) ================= */
/* The alignment is anchored at the confirmed position. Previously the whole
   sentence was replayed on every result, which made it vulnerable to the
   recognizer rewriting text it had already delivered: a reinterpreted word
   further back could lock the cursor for the rest of the sentence. Now settled
   words stay fixed, and only the not-yet-consumed hypothesis tokens are tried
   against the words from the cursor onward. */
function align(hypTokens, fromWord, fromTok){
  let i=fromWord, j=fromTok;
  const states = S.words.map(w=>w.state);
  const miscues = [];
  const rule = STRICTNESS[S.strict];

  // How many words may be passed over in total during this pass. Zero until
  // the cursor has rested long enough. The budget is consumed, otherwise
  // jumps could chain through the whole sentence.
  let budget = (performance.now() - S.posSince) >= rule.dwell ? rule.skip : 0;
  let consumed = j;

  while(j<hypTokens.length && i<S.words.length){
    const h = hypTokens[j];

    if(matches(h, S.words[i].norm)){
      states[i]='done'; i++; j++; consumed=j;
      continue;
    }

    let jumped = false;
    for(let k=1; k<=budget && i+k < S.words.length; k++){
      if(matches(h, S.words[i+k].norm)){
        for(let m=0;m<k;m++){ states[i]='skipped'; i++; }
        states[i]='done'; i++; j++; consumed=j;
        budget -= k;
        jumped = true; break;
      }
    }
    if(jumped) continue;

    // the hypothesis token didn't belong here — note it if it is close enough
    // to be a reading attempt at the current word, not just noise
    const ref = S.words[i].norm;
    if(h.length>1 && sim(h, ref) > 0.34){
      miscues.push({heard:h, expected:S.words[i].raw, at:i});
    }
    j++;
  }
  return {states, pos:i, consumed, miscues};
}

function applyAlign(hypTokens, isFinal=false){
  // The recognizer can at any time deliver a shorter token list than before —
  // on session restart, or when an interim result is replaced by a shorter
  // final result. If the anchor then points past the list the cursor stalls
  // for good, so it must be caught here. Clamp to the list end rather than
  // resetting to zero: from zero every already-consumed token is replayed
  // against the words at the cursor, and a common short word like "på" then
  // advances the cursor without anyone having said anything.
  if(S.hypConsumed > hypTokens.length) S.hypConsumed = hypTokens.length;
  $('roTok').textContent = S.hypConsumed + '/' + hypTokens.length;

  const {states,pos,consumed,miscues} = align(hypTokens, S.pos, S.hypConsumed);

  // Report misread attempts even when the cursor doesn't move — but only on
  // FINAL results. While a word is still being spoken the recognizer's
  // interim guesses are all over the place, and judging those would punish
  // words that end up correct once fully read.
  if(miscues.length && isFinal){
    const m = miscues[miscues.length-1];
    if(m.at === S.pos){
      $('roHeard').textContent = m.heard + ' \u2260 ' + m.expected;
      noteHard(m.expected);
      // interim results repeat the same guess many times in a row —
      // only make a sound when the attempt is actually new
      const key = m.at + ':' + m.heard;
      const now = performance.now();
      // the same key must be allowed again after a while, or a genuine second
      // attempt at the same word passes unremarked
      const fresh = key !== S.lastMiscueKey || now - S.lastMiscueAt > 2500;
      if(fresh && now - S.lastMiscueAt > 600){
        S.lastMiscueKey = key;
        S.lastMiscueAt = now;
        playFail();
      }
    }
  }

  if(pos <= S.pos) return false;

  // latency measurement: from voice onset to first cursor advance
  if(S.onsetAt !== null){
    const lat = performance.now() - S.onsetAt;
    if(lat > 40 && lat < 4000){
      S.lats.push(lat);
      $('roLat').textContent = Math.round(lat)+' ms';
    }
    S.onsetAt = null;
  }

  const gained = pos - S.pos;
  states.forEach((st,k)=>{ S.words[k].state = st; });
  let anyDone=false, anySkipped=false;
  for(let k=S.pos;k<pos;k++){
    if(S.words[k].state==='done'){ S.score++; anyDone=true; }
    if(S.words[k].state==='skipped'){ S.misses++; anySkipped=true; }
  }
  if(anyDone){ playOk(); S.lastMiscueKey=''; }
  S.pos = pos;
  S.posSince = performance.now();
  S.hypConsumed = consumed;
  renderSentence(); renderTrack(); updateReadouts();
  armHoldoff();

  if(S.pos >= S.words.length){
    finishLine();
  } else if(gained>0){
    setHint('', false);
  }
  return true;
}

function noteHard(word){
  const k = word.toLowerCase();
  S.hard.set(k, (S.hard.get(k)||0) + 1);
  $('roHard').textContent = S.hard.size;
}

function hardList(n){
  return [...S.hard.entries()]
    .sort((a,b)=>b[1]-a[1])
    .slice(0,n)
    .map(e=>e[0]);
}

/* The delay before moving on races anything the adult does in the meantime —
   next sentence, a new text, pause. The handle lets those cancel it, so the
   session can't advance twice or mutate a stopped session. */
function finishLine(){
  clearTimeout(S.holdTimer);
  clearTimeout(S.finishTimer);
  setHint('Bra läst!', true);
  speak('Bra läst!', 'phrase');
  const atLine = S.line, ofLines = S.lines;
  S.finishTimer = setTimeout(()=>{
    S.finishTimer = null;
    // anything that changed the text or the position wins over this callback
    if(!S.running || S.lines !== ofLines || S.line !== atLine) return;
    if(S.line < S.lines.length-1){ S.line++; loadLine(); setHint('Fortsätt när du vill.'); }
    else if(S.hard.size && !S.reviewing){
      // repeat the words that were hard, one at a time
      S.reviewing = true;
      S.source = S.lines;          // remember the text so it can be restored afterwards
      S.lines = hardList(6);
      S.line = 0; loadLine();
      setHint('Nu tar vi de svåraste orden en gång till.');
      speak('Nu tar vi de svåra orden en gång till.', 'phrase');
    }
    else {
      // the review is over: put the real text back and clear the tally, so a
      // later run through the text can earn its own review
      if(S.reviewing){
        S.reviewing = false;
        if(S.source) S.lines = S.source;
        S.hard.clear();
        $('roHard').textContent = 0;
        S.line = 0;
        loadLine();
        markActivePreset();
      }
      stop();
      playDone();
      setHint('Klart! Alla meningar är lästa.', true);
      speak('Nu är alla meningar lästa. Nu är vi klara. Vad duktig du är!', 'phrase');
    }
  }, 1600);
}

/* ================= help timer ================= */
function armHoldoff(){
  clearTimeout(S.holdTimer);
  if(!S.running || S.pos>=S.words.length) return;
  S.holdTimer = setTimeout(()=>{
    if(!S.running) return;
    // Expiring mid-utterance must not drop the chain: the child hasn't had a
    // fair silence to read in yet, so wait out the speech and try again.
    if(S.speaking){ armHoldoff(); return; }
    const el = document.querySelector(`.w[data-i="${S.pos}"]`);
    if(el){ el.classList.remove('current'); el.classList.add('helping'); }
    const w = S.words[S.pos];
    setHint('Det här ordet är ' + w.raw);
    noteHard(w.raw);
    speak(w.raw, 'word');
    armHoldoff();
  }, S.holdoff);
}

/* ================= speech ================= */
/* Two speeds. A single word to be sounded out needs the slow pace;
   encouragement and instructions in between sound sleepy at that tempo
   and therefore run faster. 'word' is the default since it is the
   sensitive use case. */
function speak(text, kind='word'){
  if(!window.speechSynthesis) return;
  // only interrupt when something is actually queued — a gratuitous cancel()
  // right before speak() can wedge the synthesizer on iOS
  if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='sv-SE';
  u.rate = kind==='phrase' ? Math.min(1.8, S.rate * 1.28) : S.rate;
  if(S.voice) u.voice=S.voice;
  S.speaking=true;
  micGate(true);
  /* Dropping onresult events while speaking is not enough: the recognizer keeps
     transcribing our own TTS into its cumulative result list, and those tokens
     would be aligned the moment the gate lifts — letting the help feature score
     the word by saying it itself. Throwing the transcript away afterwards is the
     only reliable way to discard what the app said. */
  /* Each utterance owns the shared speaking state only for its own turn.
     A cancelled utterance's onend arrives after the next one has already
     started, and without this check it would clear that one's watchdog and
     un-gate the microphone mid-speech. */
  const myTurn = ++S.speakSeq;
  const release = ()=>{
    if(S.speakSeq !== myTurn) return;
    clearTimeout(S.speakTimer);
    S.speaking=false; micGate(false);
    resetTranscript();
    armHoldoff();
  };
  u.onend = release;
  u.onerror = release;
  /* Chrome sometimes misses onend, especially after cancel(). Without this
     breaker the microphone stays muted for the rest of the session. */
  clearTimeout(S.speakTimer);
  S.speakTimer = setTimeout(release, Math.min(15000, 1200 + text.length*120));
  speechSynthesis.speak(u);
  // iOS sometimes leaves the synthesizer paused; resume() is a no-op elsewhere
  speechSynthesis.resume();
}

/* simple half-duplex: ignore recognition while the app is speaking */
let gated=false;
function micGate(on){ gated=on; }

/* ================= level meter + voice onset ================= */
let audioCtx=null, analyser=null, dataArr=null, rafId=null, wasLoud=false;
let micStream=null;

/* The stream is requested once per page load and kept. On pause only the
   audio context is suspended — the tracks are never stopped, so the browser
   doesn't have to ask for permission again. */
async function ensureAudio(){
  try{
    if(!micStream){
      micStream = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:true, noiseSuppression:true, autoGainControl:true
      }});
    }
    if(!audioCtx){
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      dataArr = new Uint8Array(analyser.fftSize);
    }
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    if(rafId) cancelAnimationFrame(rafId);
    tick();
    return true;
  }catch(e){
    showErr('Mikrofonen är inte tillgänglig: '+e.message+
      ' — kör sidan via http://localhost i stället för att öppna filen direkt, '+
      'så slipper du också tillståndsfrågan varje gång.');
    return false;
  }
}

function tick(){
  analyser.getByteTimeDomainData(dataArr);
  let sum=0;
  for(let i=0;i<dataArr.length;i++){ const v=(dataArr[i]-128)/128; sum+=v*v; }
  const rms = Math.sqrt(sum/dataArr.length);
  const pct = Math.min(100, rms*420);
  $('lvl').style.width = pct+'%';

  const loud = rms > 0.022;
  if(loud && !wasLoud && !gated && S.onsetAt===null){
    S.onsetAt = performance.now();   // voice onset
  }
  wasLoud = loud;

  // Safety net: if the child is clearly reading but the cursor has been
  // still for a long time, the recognizer session has probably ended up in a
  // state we can't untangle. Clear the transcript and start over from the
  // current word — the position is kept.
  const now = performance.now();
  if(S.running && !S.speaking && loud
     && now - S.posSince > S.holdoff * 2
     && now - S.lastRescue > 8000){
    S.lastRescue = now;
    resetTranscript();
  }

  rafId = requestAnimationFrame(tick);
}

/* ================= speech recognition ================= */
let rec=null;

function buildRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showErr('Den här webbläsaren saknar taligenkänning. Använd Chrome eller Edge.');
    return null;
  }
  const r = new SR();
  r.lang='sv-SE';
  r.continuous=true;
  r.interimResults=true;
  r.maxAlternatives=1;

  /* Every new session has an empty result list, so the token anchor must be
     reset. Without this S.hypConsumed points into a list that no longer
     exists and the alignment silently stops moving the cursor. */
  r.onstart = ()=>{
    S.ignoreResults = false;
    S.hypConsumed = 0;
    S.recLive = true;
  };

  r.onresult = ev=>{
    if(gated || S.ignoreResults) return;
    let full='';
    for(let i=0;i<ev.results.length;i++) full += ev.results[i][0].transcript+' ';
    $('roHyp').textContent = full.trim().slice(-70) || '—';
    /* A single event can carry a finalized result followed by a fresh interim
       one. Looking only at the last result would classify the whole event as
       interim and the finalized misreading would never be judged, so scan
       everything that changed in this event for a final result. */
    let anyFinal = false;
    for(let i=ev.resultIndex; i<ev.results.length; i++){
      if(ev.results[i].isFinal){ anyFinal = true; break; }
    }
    applyAlign(tokens(full), anyFinal);
  };
  r.onerror = ev=>{
    if(ev.error==='not-allowed') showErr('Mikrofonen blockerades. Tillåt åtkomst och försök igen.');
    if(ev.error==='no-speech') return;
  };
  /* Chrome ends the session on its own during silence. start() throws if
     called too soon after onend, and a swallowed exception there kills
     recognition permanently — hence a few retries. */
  r.onend = ()=>{
    S.recLive = false;
    if(!S.running) return;
    const retry = n=>{
      if(!S.running || rec !== r) return;
      try{ r.start(); }
      catch(e){
        if(n>0){ setTimeout(()=>retry(n-1), 160); return; }
        /* Out of retries this instance is dead for good, and S.running stays
           true — the app would look live while being deaf. Rebuild from
           scratch instead of giving up silently. */
        resetRecognition();
      }
    };
    retry(6);
  };
  return r;
}

/* Speech recognition can wedge itself in states we can't detect or undo —
   the retry loop in onend can also give up for good after ~1 s of failures.
   The reset button is the manual escape hatch: throw the whole recognizer
   instance away and build a fresh one. Reading position and score are kept. */
function resetRecognition(){
  S.ignoreResults = true;
  S.recLive = false;
  if(rec){
    try{ rec.onend = null; rec.stop(); }catch(e){}  // detach onend so the old instance can't restart itself
    rec = null;
  }
  S.onsetAt = null;
  S.hypConsumed = 0;
  wasLoud = false;
  $('roHyp').textContent = '—';
  $('roHeard').textContent = '—';
  if(!S.running) return;
  rec = buildRecognizer();
  if(!rec) return;
  // the old session may still be closing; retry until the new one starts
  const tryStart = n=>{
    if(!S.running || !rec) return;
    try{ rec.start(); }catch(e){ if(n>0) setTimeout(()=>tryStart(n-1), 200); }
  };
  tryStart(10);
  armHoldoff();
}

/* ================= start / stop ================= */
async function start(){
  /* S.running is only set once the microphone is granted, so without this
     guard a second press during the permission prompt re-enters start()
     instead of toggling: the microphone gets requested twice (leaking the
     losing stream) and the intro is spoken twice. */
  if(S.starting) return;
  S.starting = true;
  try{
    /* Speak BEFORE any await: iOS home-screen web apps (standalone mode) only
       allow the first speechSynthesis.speak() synchronously inside the user
       gesture — after awaiting the microphone it is silently blocked. */
    setHint('Läs högt, jag lyssnar.');
    speak('Läs högt, jag lyssnar.', 'phrase');
    const ok = await ensureAudio();
    if(!ok) return;
    if(!rec) rec = buildRecognizer();
    if(!rec) return;
    S.running=true;
    S.lats=[];
    try{ rec.start(); }catch(e){}
    $('startBtn').classList.remove('primary');
    $('startBtn').classList.add('live');
    setIcons();
    renderSentence(); renderTrack();
    armHoldoff();
  } finally {
    S.starting = false;
  }
}

function stop(){
  S.running=false;
  clearTimeout(S.holdTimer);
  clearTimeout(S.finishTimer);
  if(rec){ try{ rec.stop(); }catch(e){} }
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  if(audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(()=>{});
  wasLoud=false; S.onsetAt=null;
  $('lvl').style.width='0%';
  $('startBtn').classList.add('primary');
  $('startBtn').classList.remove('live');
  setIcons();
  renderSentence(); renderTrack();
}

function showErr(msg){
  const e=$('err'); e.textContent=msg; e.classList.add('show');
  showTab('text');
  $('sheet').classList.add('open');
}

/* ================= settings ================= */
function selectPreset(k){
  $('txt').value = PRESETS[k].join('\n');
  applyText();
}

function buildPresets(){
  const box=$('presets');
  Object.keys(PRESETS).forEach(k=>{
    const b=document.createElement('button');
    b.className='chip';
    b.innerHTML = k + ' <em>' + PRESETS[k].length + '</em>';
    b.onclick=()=>{ selectPreset(k); };
    box.appendChild(b);
  });
}

/* The same texts as quick buttons to the left of the reading area, so the
   text can be switched without opening the settings. */
function buildSide(){
  const side=$('side');
  const l=document.createElement('div');
  l.className='slabel';
  l.textContent='Texter';
  side.appendChild(l);
  Object.keys(PRESETS).forEach(k=>{
    const b=document.createElement('button');
    b.className='sbtn';
    b.textContent=k;
    b.dataset.preset=k;
    b.onclick=()=>{ selectPreset(k); };
    side.appendChild(b);
  });
}

function markActivePreset(){
  const cur = S.lines.join('\n');
  document.querySelectorAll('.sbtn').forEach(b=>{
    b.classList.toggle('active', PRESETS[b.dataset.preset].join('\n')===cur);
  });
}

/* Called on every way of closing the settings sheet, so it must be a no-op
   when the text is untouched: otherwise adjusting the volume — or dismissing
   an error — would throw the reading position back to the first sentence and
   silently abort a hard-word review. */
function applyText(){
  const lines = $('txt').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return;
  const same = S.reviewing
    ? (S.source && lines.join('\n') === S.source.join('\n'))
    : lines.join('\n') === S.lines.join('\n');
  if(same) return;
  S.lines=lines; S.line=0;
  S.source=null; S.reviewing=false;   // a new text earns a fresh review
  S.hard.clear();
  $('roHard').textContent = 0;
  loadLine();
  markActivePreset();
}

/* The browser only exposes the voices installed on the system. On macOS
   only Alva ships by default — more can be downloaded under System Settings ›
   Accessibility › Spoken Content › Manage Voices. */
let allVoices = [];

function loadVoices(){
  const sel = $('voice');
  allVoices = speechSynthesis.getVoices();
  if(!allVoices.length) return;              // Chrome fills the list asynchronously

  const lang = v => (v.lang||'').replace('_','-');
  const sv    = allVoices.filter(v=> lang(v).toLowerCase().startsWith('sv'));
  const other = allVoices.filter(v=> !lang(v).toLowerCase().startsWith('sv'));

  const prev = S.voice && S.voice.name;
  sel.innerHTML = '';

  const addGroup = (label, list) => {
    if(!list.length) return;
    const g = document.createElement('optgroup');
    g.label = label;
    list.forEach(v=>{
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name + '  ·  ' + lang(v) + (v.localService ? '' : '  · nät');
      g.appendChild(o);
    });
    sel.appendChild(g);
  };

  addGroup('Svenska (' + sv.length + ')', sv);
  addGroup('Övriga språk — nödlösning', other);

  const pick = allVoices.find(v=>v.name===prev) || sv[0] || allVoices[0];
  S.voice = pick;
  sel.value = pick.name;

  $('voiceInfo').textContent = sv.length > 1
    ? sv.length + ' svenska röster installerade'
    : sv.length === 1
      ? 'Bara en svensk röst installerad. Fler finns under Systeminställningar › Hjälpmedel › Talat innehåll › Hantera röster.'
      : 'Ingen svensk röst hittad. Installera en under Systeminställningar › Hjälpmedel › Talat innehåll.';

  sel.onchange = ()=>{
    S.voice = allVoices.find(v=>v.name===sel.value) || null;
    testVoice();
  };
}

function testVoice(){
  speak('Hej! Katten satt på mattan och tittade ut genom fönstret.', 'phrase');
}

/* ================= wiring ================= */
/* A pointer click leaves focus on the button in some browsers, which would
   then swallow the Space shortcut. Keyboard-triggered clicks report detail 0
   and keep their focus, so Tab navigation is unaffected. */
const dropFocus = e => { if(e && e.detail > 0 && e.currentTarget) e.currentTarget.blur(); };

$('startBtn').onclick = e=>{ dropFocus(e); S.running ? stop() : start(); };
$('nextBtn').onclick  = e=>{
  dropFocus(e);
  clearTimeout(S.finishTimer);
  if(S.line < S.lines.length-1){ S.line++; } else { S.line=0; }
  loadLine(); armHoldoff(); setHint('Ny mening. Läs när du vill.');
};
$('sayBtn').onclick = e=>{
  dropFocus(e);
  const w=S.words[S.pos]; if(w) speak(w.raw);
};
const TAB_SUB = {
  text:    'Klistra in läsläxan, en mening per rad.',
  reading: 'Hur texten visas och hur mycket appen släpper igenom.',
  voice:   'Hur appen låter när den läser upp ord och uppmuntran.'
};

function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>
    t.setAttribute('aria-selected', String(t.dataset.tab===name)));
  document.querySelectorAll('.tabpage').forEach(p=>
    p.classList.toggle('active', p.dataset.page===name));
  $('sheetSub').textContent = TAB_SUB[name] || '';
  $('sheet').querySelector('.cardbody').scrollTop = 0;
  if(name==='voice') loadVoices();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=> showTab(t.dataset.tab);
});

$('cbOk').onchange   = e=>{ S.sndOk = e.target.checked; if(S.sndOk) playOk(); };
$('cbFail').onchange = e=>{ S.sndFail = e.target.checked; if(S.sndFail) playFail(); };
$('rVol').oninput = e=>{
  S.vol = +e.target.value/100;
  $('vVol').textContent = e.target.value+' %';
};
/* Sound the new level directly rather than through playOk(), which is silent
   while the chime is switched off — the slider must always be audible. */
$('rVol').onchange = ()=>{ tone(1046.5, 0, 0.20, 0.5); };

/* The hint belongs to the manual press only — resetRecognition also runs by
   itself as a recovery path, and announcing that every time would confuse. */
$('resetBtn').onclick = e=>{
  dropFocus(e);
  resetRecognition();
  if(S.running) setHint('Nu lyssnar jag igen.');
};
$('testVoiceBtn').onclick = testVoice;
$('setupBtn').onclick = ()=>{ loadVoices(); $('sheet').classList.add('open'); };
$('closeBtn').onclick = ()=>{ applyText(); $('sheet').classList.remove('open'); };
$('sheet').onclick = e=>{ if(e.target===$('sheet')){ applyText(); $('sheet').classList.remove('open'); } };

$('rSize').oninput = e=>{
  document.documentElement.style.setProperty('--read-size', e.target.value+'px');
  $('vSize').textContent = e.target.value+' px';
};
$('rHold').oninput = e=>{
  S.holdoff = +e.target.value;
  $('vHold').textContent = (S.holdoff/1000).toFixed(1).replace('.',',')+' s';
  armHoldoff();
};
$('rRate').oninput = e=>{
  S.rate = +e.target.value;
  $('vRate').textContent = S.rate.toFixed(2).replace('.',',');
};
$('strict').onchange = e=>{ S.strict = e.target.value; };

/* Only form controls may swallow the shortcuts. Requiring document.body as the
   target instead would kill them for good once any button had been clicked,
   since focus stays on that button — and Space would re-activate it rather
   than toggling start/pause the way the on-screen hint promises. */
const isTyping = el =>
  !!el && (el.isContentEditable ||
           ['TEXTAREA','INPUT','SELECT','OPTION'].includes(el.tagName));

document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && $('sheet').classList.contains('open')){
    applyText(); $('sheet').classList.remove('open'); return;
  }
  if($('sheet').classList.contains('open')) return;
  if(isTyping(e.target)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.code==='Space'){
    // a button reached by Tab keeps its own Space activation — don't hijack it
    if(document.activeElement && document.activeElement.tagName==='BUTTON') return;
    e.preventDefault();          // stops the page from scrolling
    $('startBtn').click();
  }
  else if(e.key==='l' || e.key==='L'){ e.preventDefault(); $('sayBtn').click(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); $('nextBtn').click(); }
});

/* ================= init ================= */
buildPresets();
buildSide();
setIcons();
$('txt').value = S.lines.join('\n');
loadLine();
markActivePreset();
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
</script>
</body>
</html>
